name: CI & Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - ".cpanel.yml"
      - ".github/workflows/**"
      - "generator/**"
      - "scripts/**"
      - "phpunit.xml"
  push:
    branches:
      - main
    paths:
      - ".cpanel.yml"
      - ".github/workflows/**"
      - "generator/**"
      - "scripts/**"
      - "phpunit.xml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP with PHPUnit
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          tools: phpunit
          coverage: pcov

      - name: Syntax Lint (php -l)
        run: find generator scripts -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run PHPUnit with Coverage Summary
        run: phpunit --coverage-text --coverage-clover clover.xml --colors=never

      - name: Upload Coverage to Coveralls
        if: matrix.php == '8.4'
        uses: coverallsapp/github-action@v2
        with:
          file: clover.xml
          format: clover

      - name: Validate cPanel pull script
        run: bash -n scripts/cpanel-pull-deploy.sh