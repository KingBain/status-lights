name: GitHub Pages

on:
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "scripts/**"
      - "site/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "scripts/**"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate site structure
        run: python3 scripts/validate-site.py

      - name: Validate JavaScript syntax
        run: node --check site/script.js

      - name: Smoke test static site
        shell: bash
        run: |
          python3 -m http.server 4173 --directory site > /tmp/status-lights-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --retry 5 --retry-connrefused http://127.0.0.1:4173/ > /dev/null
          curl --fail http://127.0.0.1:4173/styles.css > /dev/null
          curl --fail http://127.0.0.1:4173/script.js > /dev/null

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy site
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

